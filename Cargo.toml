[package]
name = "fertility_analyzer"
version = "0.1.0"
edition = "2021"
description = "Multilingual Fertility & Token Overhead Analysis - modular Rust implementation"
license = "MIT"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
unicode-normalization = "0.1"
unicode-segmentation = "1.11"
clap = { version = "4.5", features = ["derive"] }
once_cell = "1.19"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "fertility_bench"
harness = false
